<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEON BULL • Lamborghini Reimagined</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');
        :root { --neon-pink: #ff00ff; --neon-cyan: #00ffff; }
        body { font-family: 'Orbitron', sans-serif; }
        .neon-text { text-shadow: 0 0 5px var(--neon-pink),0 0 10px var(--neon-pink),0 0 20px var(--neon-pink),0 0 40px var(--neon-cyan),0 0 80px var(--neon-cyan); }
        .neon-cyan { text-shadow: 0 0 5px var(--neon-cyan),0 0 10px var(--neon-cyan),0 0 20px var(--neon-cyan),0 0 40px var(--neon-pink),0 0 80px var(--neon-pink); }
    </style>
</head>
<body class="bg-black text-white overflow-x-hidden">
    <nav class="fixed top-0 z-50 w-full border-b border-cyan-500/30 bg-black/80 backdrop-blur-lg">
        <div class="max-w-7xl mx-auto px-6 py-5 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-9 h-9 bg-gradient-to-br from-pink-500 to-cyan-500 rounded-full flex items-center justify-center font-black text-xl">NB</div>
                <span class="text-3xl font-black tracking-widest neon-text">NEON BULL</span>
            </div>
            <a href="https://tenthavenuewebdesign.com" class="text-pink-400 hover:text-white">← Tenth Avenue</a>
        </div>
    </nav>

    <section class="min-h-screen flex items-center pt-16">
        <div class="max-w-7xl mx-auto px-6 grid md:grid-cols-2 gap-12 items-center">
            <div>
                <h1 class="text-7xl md:text-8xl font-black tracking-tighter neon-text">NEON<br>LAMBORGHINI</h1>
                <p class="text-2xl text-cyan-300 mt-4">Electric fury meets retro-futurist glow.</p>
                <button onclick="document.getElementById('gallery').scrollIntoView({behavior:'smooth'})" class="mt-8 px-10 py-5 bg-gradient-to-r from-pink-600 to-cyan-500 text-black font-bold text-lg">EXPLORE THE RIDE</button>
            </div>
            <img src="https://picsum.photos/id/1015/1200/800" alt="Neon Lamborghini" class="rounded-3xl shadow-2xl">
        </div>
    </section>

    <section id="gallery" class="py-24 bg-zinc-950">
        <div class="max-w-7xl mx-auto px-6">
            <h2 class="text-5xl font-bold neon-text text-center mb-12">VISUAL FURY</h2>
            <div class="grid md:grid-cols-3 gap-8">
                <img src="https://picsum.photos/id/1015/800/600" class="rounded-2xl" alt="1">
                <img src="https://picsum.photos/id/133/800/600" class="rounded-2xl" alt="2">
                <img src="https://picsum.photos/id/201/800/600" class="rounded-2xl" alt="3">
            </div>
        </div>
    </section>

    <footer class="py-12 text-center text-zinc-500 text-sm border-t border-pink-900">
        Built by Tenth Avenue Web Design • 2026
    </footer>
</body>
</html>
